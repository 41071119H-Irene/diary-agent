<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diary Agent</title>
    <style>
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    }
    body {
        font-family: Arial, sans-serif;
        display: flex;
        height: 100vh;
        padding: 20px; /* 整個頁面與螢幕邊緣保留距離 */
        gap: 20px; /* 讓左側與右側有間距 */
    }
    .sidebar {
        width: 300px;
        background: #f4f4f4;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 15px;
        border-radius: 10px; /* 增加圓角 */
    }
    .sidebar label {
        display: block;
        background: #007bff;
        color: white;
        text-align: center;
        padding: 10px;
        cursor: pointer;
        border-radius: 5px;
    }
    .sidebar label:hover {
        background: #0056b3;
    }
    .sidebar input[type="file"] {
        display: none;
    }
    .sidebar button {
        width: 100%;
        padding: 10px;
        background: #28a745;
        color: white;
        border: none;
        cursor: pointer;
        border-radius: 5px;
    }
    .sidebar button:hover {
        background: #218838;
    }
    .content {
        flex-grow: 1;
        padding: 20px;
        border-radius: 10px;
        background: white;
    }
    .input-group {
        display: flex;
        margin-bottom: 15px;
    }
    .input-group input {
        flex: 1;
        padding: 10px;
        border: 1px solid #ccc;
    }
    .chart {
        width: 100%;
        height: 200px;
        background: lightgray;
        margin-bottom: 15px;
        border-radius: 8px;
    }
    .textarea {
        width: 100%;
        height: 100px;
        border: 1px solid #ccc;
        padding: 10px;
        border-radius: 8px;
    }
    .chat-container {
        flex-grow: 1.5; /* 減少右側比例，讓對話區變小 */
        display: flex;
        flex-direction: column;
        padding: 20px;
        background: #f9f9f9;
        flex-basis: 450px; /* 限制右側最大寬度 */
        border-radius: 10px;
    }
    .chat-box {
        flex-grow: 1;
        border: 1px solid #ccc;
        background: white;
        padding: 10px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
        max-height: 400px; /* 限制聊天內容區高度 */
        border-radius: 8px;
    }
    .message {
        padding: 8px 12px;
        border-radius: 8px;
        max-width: 70%;
    }
    .user-message {
        align-self: flex-end;
        background: #007bff;
        color: white;
    }
    .bot-message {
        align-self: flex-start;
        background: #e0e0e0;
    }
    .input-box {
        display: flex;
        margin-top: 10px;
    }
    .input-box input {
        flex-grow: 1;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
    }
    .input-box button {
        padding: 10px 15px;
        background: #007bff;
        color: white;
        border: none;
        cursor: pointer;
        border-radius: 5px;
    }
    .input-box button:hover {
        background: #0056b3;
    }

    </style>
</head>
<body>
    <div class="sidebar">
        <h2>Dairy Agent</h2>
        <h4>透過日記讓你活的更正向</h4>
        <label for="fileUpload">📂 上傳日誌</label>
        <input type="file" id="fileUpload">
        <button>Submit</button>
        <h3>My Big 3</h3>
        <ul>
            <li>項目 1</li>
            <li>項目 2</li>
            <li>項目 3</li>
        </ul>
        <h3>建議</h3>
        <ul>
            <li>項目 1</li>
            <li>項目 2</li>
            <li>項目 3</li>
        </ul>
        <h3>情緒走向</h3>
        <div class="chart"></div>
    </div>

    <div class="chat-container">
        <h2>對話紀錄</h2>
        <div class="chat-box" id="chatBox">
            <div class="message bot-message">你好！請輸入您的問題。</div>
        </div>
        <div class="input-box">
            <input type="text" id="userInput" placeholder="輸入訊息...">
            <button onclick="sendMessage()">發送</button>
        </div>
    </div>

    <script>
        function sendMessage() {
            let inputField = document.getElementById("userInput");
            let chatBox = document.getElementById("chatBox");
            let message = inputField.value.trim();
            
            if (message === "") return;

            // 新增使用者訊息
            let userMsg = document.createElement("div");
            userMsg.classList.add("message", "user-message");
            userMsg.textContent = message;
            chatBox.appendChild(userMsg);

            // 清空輸入框
            inputField.value = "";

            // 模擬系統回應
            setTimeout(() => {
                let botMsg = document.createElement("div");
                botMsg.classList.add("message", "bot-message");
                botMsg.textContent = "這是系統的回覆：" + message;
                chatBox.appendChild(botMsg);

                // 讓對話框滾動到底部
                chatBox.scrollTop = chatBox.scrollHeight;
            }, 1000);
        }
    </script>
</body>
</html>
