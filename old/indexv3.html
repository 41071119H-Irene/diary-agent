<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心情分析與趨勢</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center">心情分析與趨勢</h1>
        
        <form action="/upload" method="post" enctype="multipart/form-data">
            <div class="mb-3">
                <label for="file" class="form-label">上傳您的日記檔案 (CSV 格式)</label>
                <input type="file" class="form-control" id="file" name="file" required>
            </div>
            <button type="submit" class="btn btn-primary">上傳並分析</button>
        </form>

        {% if analysis %}
        <h2 class="mt-5">分析結果</h2>
        <div class="alert alert-info">
            <p><strong>分析內容：</strong></p>
            <ul>
                {% for item in analysis %}
                <li>{{ item }}</li>
                {% endfor %}
            </ul>
        </div>

        <h3>正向思考建議</h3>
        <div class="alert alert-success">
            <ul>
                {% for item in recommendations %}
                <li>{{ item }}</li>
                {% endfor %}
            </ul>
        </div>

        <h3>心情趨勢圖</h3>
        <img id="moodTrendImg" src="{{ mood_trend_image }}" alt="Mood Trend">
        {% endif %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
